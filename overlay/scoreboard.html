<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0B">
<title>Pool Arena</title>
<link rel="stylesheet" href="/src/board.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="game" id="game-title">Pool Arena</div>
        <div class="state" id="game-state">connecting</div>
      </div>
    </div>
    <div class="bar-right">
      <div class="shotno"><span id="shot-no">—</span><small>shot</small></div>
      <button class="icon" id="toggle-setup" aria-expanded="false" title="Game setup">Setup</button>
    </div>
  </header>

  <div class="alert" id="alert" hidden></div>

  <section class="setup" id="setup" hidden>
    <div class="games" id="games"></div>
    <div class="roster">
      <label for="players">Players</label>
      <input id="players" value="Player 1, Player 2" autocomplete="off" spellcheck="false">
      <span class="hint" id="roster-hint"></span>
    </div>
    <div class="setup-actions">
      <button class="go" id="start">Start game</button>
      <button id="pass">Pass turn</button>
      <button id="boom">Test effect</button>
      <button id="calib">Calibrate projector</button>
    </div>
  </section>

  <section class="calib-panel" id="calib-panel" hidden>
    <div class="calib-head">
      <strong>Projector calibration</strong>
      <span>Pick a corner, then nudge it onto the matching corner of the cushion.</span>
    </div>
    <div class="calib-body">
      <div class="corner-pick" id="corner-pick">
        <button data-c="0">TL</button><button data-c="1">TR</button>
        <button data-c="3">BL</button><button data-c="2">BR</button>
      </div>
      <div class="dpad" id="dpad">
        <button data-dx="0"  data-dy="-1" class="up">▲</button>
        <button data-dx="-1" data-dy="0"  class="left">◀</button>
        <button data-dx="1"  data-dy="0"  class="right">▶</button>
        <button data-dx="0"  data-dy="1"  class="down">▼</button>
        <label class="step"><input type="checkbox" id="big-step"> 10 px</label>
      </div>
      <div class="calib-actions">
        <button id="calib-reset">Reset corners</button>
        <button class="go" id="calib-done">Done</button>
      </div>
    </div>
  </section>

  <main class="grid">
    <section class="felt-wrap">
      <canvas id="mini"></canvas>
      <div class="felt-tag" id="felt-tag">live</div>
    </section>

    <section class="players" id="players-list"></section>

    <section class="feed-panel">
      <div class="feed-head">Shot feed</div>
      <ol class="feed" id="feed"></ol>
    </section>
  </main>

</div>
<script type="module" src="/src/board.js"></script>
</body>
</html>
