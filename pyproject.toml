[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poolarena"
version = "0.1.0"
description = "Camera scoring and projected games for a real pool table"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# numpy is the only hard requirement: the server is standard library, and the
# overlay is plain ES modules with no build step.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Capped below 5 on purpose: OpenCV 5's Windows build dropped the
# DirectShow and Media Foundation videoio backends, leaving FFmpeg,
# which can count virtual cameras but cannot open one. A phone used as
# a webcam is then visible in the device list and unusable.
vision = ["opencv-python>=4.8,<5"]
kinect-linux = ["pylibfreenect2>=0.1.4"]
kinect-windows = ["pykinect2>=0.1.0"]
yolo = ["ultralytics>=8.0"]
dev = ["pytest>=7.4"]

[project.scripts]
poolarena = "poolarena.__main__:main"

[tool.setuptools]
packages = [
  "poolarena", "poolarena.vision", "poolarena.events",
  "poolarena.rules", "poolarena.server", "poolarena.sim",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
